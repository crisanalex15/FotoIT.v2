# Server
server.port=8080

# Admin Security Credentials
# Seteaza ADMIN_PASSWORD ca variabila de mediu. Fara ea, se genereaza o parola aleatorie la pornire (vezi log-ul).
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

# Adresa publica a site-ului (folosita in link-urile de galerie trimise clientilor)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# CORS - originile frontend-ului, separate prin virgula
# (*.trycloudflare.com = link-urile temporare create de start-public.bat)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.trycloudflare.com}

# Limita de cereri pe IP pentru cautarea unei galerii dupa cod (protectie brute-force)
app.gallery.lookup-limit-per-minute=30

# Thumbnail-uri
app.thumbnails.cache-dir=cache/thumbnails
app.thumbnails.max-size=800
app.thumbnails.max-concurrent=2
# Versiunea mare pentru vizualizare pe tot ecranul (generata la cerere, nu la sincronizare)
app.previews.max-size=2048
# Numar maxim de poze intr-o arhiva ZIP
app.zip.max-files=500

# Database - SQLite cu modul WAL (Write-Ahead Logging) pentru concurenta sporita
spring.datasource.url=jdbc:sqlite:fotoit.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.format_sql=true

# Google Drive (Poate fi suprascris si prin variabila de mediu GOOGLE_CREDENTIALS_JSON)
google.drive.credentials.path=classpath:fotoit-gallery-credentials.json

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=86400
# Versionare dupa continut: /css/admin.css devine /css/admin-<hash>.css, deci browserul
# ia automat fisierul nou dupa orice modificare, desi il tine in cache 24h
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.mvc.static-path-pattern=/**

# Async Request Timeout pentru StreamingResponseBody (10 minute pentru transferuri mari ZIP)
spring.mvc.async.request-timeout=600000

# Nu expune detalii interne in raspunsurile de eroare
server.error.include-message=never
server.error.include-stacktrace=never

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
